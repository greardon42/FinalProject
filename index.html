\<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Bowl Wins, Losses, and Appearances</title>
  <script src="https://d3js.org/d3.v3.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
    }

    .bar {
      fill: steelblue;
    }

    .bar:hover {
      fill: orange;
    }

    .axis text {
      font-size: 12px;
    }

    .tooltip {
      position: absolute;
      text-align: left;
      padding: 8px;
      font-size: 12px;
      background: lightsteelblue;
      border: 1px solid #333;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>
  <h1>Super Bowl Team Performance</h1>

  <h2>Wins and Losses</h2>
  <div id="bar-chart"></div>

  <h2>Total Appearances with Hover Details</h2>
  <div id="pie-chart"></div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    // Data for teams: wins, losses, and team colors
    const teams = [
      { team: "49ers", wins: 5, losses: 2, color: "#AA0000" },
      { team: "Chiefs", wins: 1, losses: 1, color: "#E31837" },
      { team: "Patriots", wins: 6, losses: 5, color: "#002244" },
      { team: "Eagles", wins: 1, losses: 2, color: "#004C54" },
      { team: "Broncos", wins: 3, losses: 5, color: "#FB4F14" },
      { team: "Seahawks", wins: 1, losses: 2, color: "#002244" },
      { team: "Ravens", wins: 2, losses: 0, color: "#241773" },
      { team: "Giants", wins: 4, losses: 1, color: "#0B2265" },
      { team: "Packers", wins: 4, losses: 1, color: "#203731" },
      { team: "Steelers", wins: 6, losses: 2, color: "#FFB612" },
      { team: "Colts", wins: 2, losses: 2, color: "#002C5F" },
      { team: "Cardinals", wins: 0, losses: 1, color: "#97233F" },
      { team: "Rams", wins: 1, losses: 3, color: "#003594" },
      { team: "Buccaneers", wins: 1, losses: 0, color: "#D50A0A" },
      { team: "Panthers", wins: 0, losses: 2, color: "#0085CA" },
      { team: "Bears", wins: 1, losses: 1, color: "#0B162A" },
      { team: "Falcons", wins: 0, losses: 2, color: "#A71930" },
      { team: "Raiders", wins: 2, losses: 2, color: "#000000" },
      { team: "Redskins", wins: 3, losses: 2, color: "#773141" },
      { team: "Cowboys", wins: 5, losses: 3, color: "#041E42" },
      { team: "Dolphins", wins: 2, losses: 3, color: "#008E97" },
      { team: "Vikings", wins: 0, losses: 4, color: "#4F2683" },
      { team: "Bills", wins: 0, losses: 4, color: "#00338D" },
      { team: "Jets", wins: 1, losses: 0, color: "#125740" },
      { team: "Saints", wins: 1, losses: 0, color: "#D3BC8D" },
      { team: "Bengals", wins: 0, losses: 2, color: "#FB4F14" },
      { team: "Chargers", wins: 0, losses: 1, color: "#0080C6" },
      { team: "Titans", wins: 0, losses: 1, color: "#4B92DB" }
    ];

    // Tooltip setup
    const tooltip = d3.select("#tooltip");

    // BAR CHART SETUP
    const margin = { top: 20, right: 20, bottom: 100, left: 60 };
    const width = 960 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    const x = d3.scale.ordinal()
                .rangeRoundBands([0, width], 0.2)
                .domain(teams.map(d => d.team));

    const y = d3.scale.linear()
                .range([height, 0])
                .domain([0, d3.max(teams, d => Math.max(d.wins, d.losses)) + 1]);

    const xAxis = d3.svg.axis().scale(x).orient("bottom");
    const yAxis = d3.svg.axis().scale(y).orient("left");

    const svg = d3.select("#bar-chart").append("svg")
                  .attr("width", width + margin.left + margin.right)
                  .attr("height", height + margin.top + margin.bottom)
                .append("g")
                  .attr("transform", `translate(${margin.left},${margin.top})`);

    // Create x-axis and y-axis
    svg.append("g")
       .attr("class", "x axis")
       .attr("transform", `translate(0,${height})`)
       .call(xAxis)
       .selectAll("text")
         .style("text-anchor", "end")
         .attr("dx", "-0.8em")
         .attr("dy", "0.15em")
         .attr("transform", "rotate(-65)");

    svg.append("g")
       .attr("class", "y axis")
       .call(yAxis)
     .append("text")
       .attr("transform", "rotate(-90)")
       .attr("y", -50)
       .attr("dy", ".71em")
       .style("text-anchor", "end")
       .text("Count");

    // Add bars for Wins and Losses
    svg.selectAll(".bar.wins")
      .data(teams)
      .enter().append("rect")
      .attr("class", "bar wins")
      .attr("x", d => x(d.team))
      .attr("width", x.rangeBand() / 2)
      .attr("y", d => y(d.wins))
      .attr("height", d => height - y(d.wins))
      .style("fill", "green")
      .on("mouseover", d => {
        tooltip.transition().duration(200).style("opacity", 0.9);
        tooltip.html(`<strong>${d.team}</strong><br/>Wins: ${d.wins}`)
               .style("left", `${d3.event.pageX + 10}px`)
               .style("top", `${d3.event.pageY - 30}px`);
      })
      .on("mouseout", () => {
        tooltip.transition().duration(500).style("opacity", 0);
      });

    svg.selectAll(".bar.losses")
      .data(teams)
      .enter().append("rect")
      .attr("class", "bar losses")
      .attr("x", d => x(d.team) + x.rangeBand() / 2)
      .attr("width", x.rangeBand() / 2)
      .attr("y", d => y(d.losses))
      .attr("height", d => height - y(d.losses))
      .style("fill", "red")
      .on("mouseover", d => {
        tooltip.transition().duration(200).style("opacity", 0.9);
        tooltip.html(`<strong>${d.team}</strong><br/>Losses: ${d.losses}`)
               .style("left", `${d3.event.pageX + 10}px`)
               .style("top", `${d3.event.pageY - 30}px`);
      })
      .on("mouseout", () => {
        tooltip.transition().duration(500).style("opacity", 0);
      });

    // PIE CHART SETUP
    const pieWidth = 500, pieHeight = 500, radius = Math.min(pieWidth, pieHeight) / 2;
    const arc = d3.svg.arc().outerRadius(radius - 10).innerRadius(0);
    const pie = d3.layout.pie().sort(null).value(d => d.wins + d.losses);

    const pieSvg = d3.select("#pie-chart").append("svg")
                     .attr("width", pieWidth)
                     .attr("height", pieHeight)
                   .append("g")
                     .attr("transform", `translate(${pieWidth / 2},${pieHeight / 2})`);

    const arcs = pieSvg.selectAll(".arc")
                       .data(pie(teams))
                       .enter().append("g")
                       .attr("class", "arc");

    arcs.append("path")
        .attr("d", arc)
        .style("fill", d => d.data.color)
        .on("mouseover", function(d) {
          d3.select(this)
            .transition().duration(200)
            .style("opacity", 0.7)
            .attr("transform", "scale(1.05)");

          tooltip.transition().duration(200).style("opacity", 1);
          tooltip.html(`<strong>${d.data.team}</strong><br/>Appearances: ${d.data.wins + d.data.losses}<br/>Wins: ${d.data.wins}<br/>Losses: ${d.data.losses}`)
                 .style("left", `${d3.event.pageX + 10}px`)
                 .style("top", `${d3.event.pageY - 28}px`);
        })
        .on("mouseout", function() {
          d3.select(this)
            .transition().duration(200)
            .style("opacity", 1)
            .attr("transform", "scale(1)");

          tooltip.transition().duration(500).style("opacity", 0);
        });

    arcs.append("text")
        .attr("transform", d => `translate(${arc.centroid(d)})`)
        .attr("dy", ".35em")
        .style("text-anchor", "middle")
        .style("font-size", "10px")
        .text(d => d.data.team);
  </script>
</body>
</html>
